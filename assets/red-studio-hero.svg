 <text x="402" y="52" fill="#c6a5aa" font-family="monospace" font-size="13" letter-spacing="1.4">WORK</text>
 <text x="488" y="52" fill="#79666a" font-family="monospace" font-size="13" letter-spacing="1.4">/</text>
 <text x="515" y="52" fill="#c6a5aa" font-family="monospace" font-size="13" letter-spacing="1.4">RESEARCH</text>
 <rect x="989" y="27" width="164" height="37" rx="18" fill="#301119" stroke="#9f3140"/>
 <circle cx="1011" cy="45.5" r="5" fill="#ff4055" class="core"/>
 <text x="1025" y="50" fill="#f9d5da" font-family="monospace" font-size="13" font-weight="bold">SYSTEM ONLINE</text>
 <rect x="49" y="120" width="6" height="18" fill="#e22d42"/>
 <text x="69" y="134" fill="#fb6374" font-family="monospace" font-size="15" font-weight="bold" letter-spacing="3">INDEPENDENT SECURITY STUDIO</text>
 <g class="title">
 <text x="42" y="227" fill="#fff3f4" font-family="Arial,Helvetica,sans-serif" font-size="89" font-weight="900" letter-spacing="-3">MACALLAN</text>
 <text x="43" y="315" fill="#f53a51" font-family="Arial,Helvetica,sans-serif" font-size="89" font-weight="900" letter-spacing="-3">THE ROOT</text>
 </g>
 <text x="50" y="362" fill="#f5dce0" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600">Efe Şahinbaş</text>
 <text x="240" y="362" fill="#9d7981" font-family="monospace" font-size="14">/ RED TEAM  ×  BLUE TEAM  ×  OSINT</text>
