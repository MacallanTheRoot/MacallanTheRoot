<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc"><title id="title">MacallanTheRoot — Security Research Studio</title><desc id="desc">Original dark red portfolio-style header with laboratory graphic, the name Efe Şahinbaş, and security research focus.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09090e"/><stop offset=".62" stop-color="#150c12"/><stop offset="1" stop-color="#2b0c15"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#e33348" stop-opacity=".38"/><stop offset=".57" stop-color="#a21c30" stop-opacity=".12"/><stop offset="1" stop-color="#c62438" stop-opacity="0"/></radialGradient>
 <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#be2337"/><stop offset=".5" stop-color="#ff4459"/><stop offset="1" stop-color="#64121e"/></linearGradient>
 <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#6c2635" stroke-opacity=".18" stroke-width="1"/></pattern>
 <clipPath id="panel"><rect width="1198" height="448" x="1" y="1" rx="20"/></clipPath>
 </defs>
 <style>
 @keyframes pulse{0%,100%{opacity:.22}50%{opacity:.7}}
 @keyframes sweep{0%{transform:translateY(-8px);opacity:0}35%{opacity:.5}100%{transform:translateY(280px);opacity:0}}
 @keyframes enter{0%{opacity:.3;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
 .title{animation:enter 1.2s ease-out both}
 .scan{animation:sweep 6s linear infinite}
 .core{animation:pulse 3s ease-in-out infinite}
 @media (prefers-reduced-motion:reduce){.title,.scan,.core{animation:none}}
 </style>
 <g clip-path="url(#panel)">
 <rect width="1200" height="450" fill="url(#bg)"/>
 <rect width="1200" height="450" fill="url(#grid)" opacity=".8"/>
 <ellipse cx="1020" cy="230" rx="305" ry="270" fill="url(#glow)"/>
 <path d="M0 83H1200" stroke="#6e2936" stroke-opacity=".85"/>
 <path d="M0 414H1200" stroke="#6e2936" stroke-opacity=".85"/>
 <path d="M0 2H1200" stroke="url(#edge)" stroke-width="4"/>
 <rect x="38" y="27" width="38" height="38" rx="9" fill="#a81a2d"/>
 <path d="M48 39L58 55L68 39" fill="none" stroke="#fff1f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="93" y="53" fill="#f6e8ea" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" letter-spacing="2">M / R</text>
