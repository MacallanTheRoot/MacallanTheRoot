name: Refresh public profile metrics
on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/refresh_profile.py"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: public-profile-metrics
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate public metric and PR status cards
        run: python3 scripts/refresh_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed SVG cards
        run: |
          git add assets/github-metrics.svg assets/pr-*.svg
          if git diff --cached --quiet; then
            echo "No changes to profile metrics"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh verified public GitHub activity"
          git push
